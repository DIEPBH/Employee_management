<form class="js-excel-import-form"
      id="excelImportForm"
      method="post"
      enctype="multipart/form-data"
      action="{% url 'employee:emp_title_import_modal' %}">
  {% csrf_token %}

  <div class="mb-3">
    <label class="form-label">Chọn file Excel (.xlsx)</label>
    {{ form.file }}
    {% if form.file.errors %}
      <div class="text-danger small">{{ form.file.errors }}</div>
    {% endif %}
  </div>

  <div class="d-flex gap-2">
    <button class="btn btn-primary" type="submit">Import</button>
    <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Đóng</button>
  </div>

  <div id="importResult" class="js-import-result mt-3"></div>
</form>
